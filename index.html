<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P リアルタイム StudyRoom</title>
  <!-- Tailwind CSS & PeerJS Library -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    /* 温かみのあるスクロールバー */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #fff7ed; }
    ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #ea580c; }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- ==================== 1. ホーム / ルーム一覧画面 ==================== -->
  <div id="screen-title" class="fixed inset-0 z-40 bg-stone-900/95 backdrop-blur-md flex flex-col overflow-y-auto">
    <div class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto flex flex-col gap-6">
      
      <!-- ヘッダーブランディング -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-500 to-amber-400 text-white rounded-2xl shadow-lg shadow-orange-500/20 transform -rotate-2">
          <!-- Mug Inline SVG -->
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/>
          </svg>
        </div>
        <h1 class="text-3xl font-extrabold text-amber-50 tracking-tight">合同学習ノートツール</h1>
        <p class="text-stone-400 text-sm max-w-md mx-auto">静かな空間で、仲間と一緒に勉強・メモ共有・画面共有を行えます。</p>
      </div>

      <!-- メインアクションカード -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- 新規ルーム作成ボタン -->
        <button onclick="openNameModal('host')" class="group relative overflow-hidden bg-gradient-to-br from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white p-6 rounded-2xl shadow-xl shadow-orange-500/20 transition-all duration-300 hover:-translate-y-1 text-left flex flex-col justify-between h-40">
          <div class="flex items-center justify-between">
            <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
              </svg>
            </div>
            <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-bold">新規作成</span>
          </div>
          <div>
            <div class="font-bold text-lg">新しく学習室を作る</div>
            <div class="text-xs text-amber-100 mt-1">公開・合言葉保護が選べます</div>
          </div>
        </button>

        <!-- コードで直接参加ボタン -->
        <button onclick="openNameModal('guest')" class="group relative overflow-hidden bg-stone-800 hover:bg-stone-750 border border-stone-700 text-stone-100 p-6 rounded-2xl shadow-md transition-all duration-300 hover:-translate-y-1 text-left flex flex-col justify-between h-40">
          <div class="flex items-center justify-between">
            <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
              </svg>
            </div>
            <span class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full font-bold">ID指定</span>
          </div>
          <div>
            <div class="font-bold text-lg text-amber-50">5桁コードで参加</div>
            <div class="text-xs text-stone-400 mt-1">共有されたIDを入力して入室します</div>

        </button>

        <!-- ルームリフレッシュ・統計 -->
        <div class="bg-stone-800/80 border border-stone-700 p-6 rounded-2xl flex flex-col justify-between h-40">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">オンライン学習室</span>
            <button onclick="refreshPublicRoomsUI()" class="text-stone-300 hover:text-amber-400 text-xs flex items-center gap-1 bg-stone-700/60 px-2.5 py-1 rounded-lg border border-stone-600 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
              <span>更新</span>
            </button>
          </div>
          <div>
            <div id="room-count-badge" class="text-2xl font-black text-amber-400">0 個の部屋</div>
            <div class="text-xs text-stone-400 mt-1">リアルタイム同期中</div>
          </div>
        </div>

      </div>

      <!-- アクティブな公開ルーム一覧 -->

        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-amber-50 text-base flex items-center gap-2">
            <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>
            </svg>
            自習室一覧

          <span class="text-xs text-stone-400">ワンタップで参加可能</span>
        </div>

        <div id="public-room-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <div class="col-span-full py-8 text-center text-stone-400 text-sm flex flex-col items-center justify-center gap-2">

  <!-- ==================== 2. 設定モーダル ==================== -->

    <div class="max-w-md w-full bg-stone-800 border border-stone-700 rounded-3xl p-6 shadow-2xl my-auto transition-all">
      
      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-xl font-bold text-amber-50">自習室に参加</h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-stone-700 hover:bg-stone-600 text-stone-300 flex items-center justify-center transition">
          ✕
        </button>
      </div>
      
      <div class="space-y-4 mb-6">
        
        <!-- アバター選択 & ローカル画像アップロード -->
        <div>
          <label class="block text-xs font-bold text-amber-400/90 uppercase tracking-wider mb-2">学習アバター設定</label>
          <div class="flex items-center gap-4">
            <!-- プレビュー -->
            <div id="avatar-preview-container" class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white text-2xl font-bold overflow-hidden shadow-md border-2 border-amber-400/40 shrink-0">
              <span id="avatar-initial">🍵</span>
              <img id="avatar-image-preview" class="w-full h-full object-cover hidden" alt="Avatar">
            </div>
            
            <div class="flex-1 space-y-1.5">
              <label class="inline-flex items-center gap-2 px-3 py-2 bg-stone-700 hover:bg-stone-600 text-amber-300 text-xs font-bold rounded-xl cursor-pointer transition border border-stone-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>

              </label>
              
              <!-- 絵文字プリセット選択 -->
              <div class="flex gap-1.5 pt-1">
                <button type="button" onclick="selectEmojiAvatar('🍵')" class="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg text-sm flex items-center justify-center">🍵</button>
                <button type="button" onclick="selectEmojiAvatar('🐱')" class="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg text-sm flex items-center justify-center">🐱</button>
                <button type="button" onclick="selectEmojiAvatar('📚')" class="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg text-sm flex items-center justify-center">📚</button>
                <button type="button" onclick="selectEmojiAvatar('☕')" class="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg text-sm flex items-center justify-center">☕</button>
                <button type="button" onclick="selectEmojiAvatar('🌟')" class="w-7 h-7 bg-stone-700 hover:bg-stone-600 rounded-lg text-sm flex items-center justify-center">🌟</button>

        </div>

        <!-- 名前入力 -->
        <div>

          <input type="text" id="input-username" maxlength="10" placeholder="例: さくら" class="w-full px-4 py-3 bg-stone-900 border border-stone-700 rounded-xl text-stone-100 focus:outline-none focus:border-orange-500 transition">

        <!-- 部屋コード入力 -->
        <div id="container-room-code" class="hidden">
          <label class="block text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">5桁の部屋コード</label>
          <input type="text" id="input-room-code" maxlength="5" placeholder="例: 7A9K2" class="w-full px-4 py-3 bg-stone-900 border border-stone-700 rounded-xl text-amber-400 uppercase tracking-widest font-mono text-center text-lg font-bold focus:outline-none focus:border-orange-500 transition">
        </div>

        <!-- パスワード入力 -->

          </div>

          <div>
            <label class="block text-[11px] font-semibold text-stone-400 mb-1">合言葉保護 (任意)</label>
            <input type="password" id="input-host-password" placeholder="合言葉なしで作成" class="w-full px-4 py-2.5 bg-stone-900 border border-stone-700 rounded-xl text-stone-100 text-xs focus:outline-none focus:border-orange-500 transition">
          </div>
        </div>

        <!-- エラーメッセージ -->
        <div id="error-message" class="hidden text-rose-400 text-xs bg-rose-950/40 border border-rose-800 p-3 rounded-xl flex items-center gap-2">

      <div class="flex gap-3">

      <!-- ルーム情報 & 自分のアバター -->

        <div class="flex items-center gap-2 bg-stone-900 px-3 py-1.5 rounded-xl border border-stone-700">
          <span class="text-xs text-amber-400 font-bold">ROOM:</span>
          <span id="display-room-code" class="font-mono font-bold text-orange-400 tracking-wider">-----</span>

            </svg>
          </button>
        </div>

        <div class="flex items-center gap-2 bg-stone-900/60 border border-stone-700 px-2.5 py-1 rounded-xl">
          <div id="header-avatar-container" class="w-6 h-6 rounded-full bg-orange-500 text-white text-xs font-bold flex items-center justify-center overflow-hidden">
            🍵
          </div>
          <span id="my-name-tag" class="text-xs text-stone-200 font-semibold truncate max-w-[80px] sm:max-w-[120px]">-----</span>
        </div>
      </div>

      <!-- 右側コントロールボタン -->
      <div class="flex items-center gap-2">
        
        <!-- 音声入力切替 -->
        <button id="btn-mic" onclick="toggleMic()" class="px-3 py-2 bg-stone-700 hover:bg-stone-650 text-stone-200 font-semibold text-xs rounded-xl transition border border-stone-600 flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>

          <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">

          </svg>

        </button>

        <!-- 退出ボタン -->
        <button onclick="leaveRoom()" class="px-3 py-2 bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800 text-xs font-bold rounded-xl transition flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>

    <!-- メインコンテンツ -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
      
      <!-- 画面共有・メンバー一覧 -->
      <div class="flex-1 p-4 flex flex-col gap-5 overflow-y-auto">
        
        <!-- 画面共有エリア -->

          <span>共有学習メモ</span>
          <span class="text-[10px] text-stone-400 font-normal">リアルタイム同期</span>
        </div>

        <div id="memo-list" class="flex-1 p-4 overflow-y-auto space-y-3 bg-stone-900/50"></div>

        <div class="p-3 bg-stone-800 border-t border-stone-700 shrink-0">
          <div class="flex items-center gap-2">
            <label title="資料追加" class="p-2.5 bg-stone-700 hover:bg-stone-600 text-amber-400 rounded-xl cursor-pointer transition flex items-center justify-center border border-stone-600">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
              </svg>
              <input type="file" id="file-input" class="hidden" accept="image/*,video/*,audio/*" onchange="handleFileUpload(event)">
            </label>
            <input type="text" id="memo-input" placeholder="学習ノート・メモを入力..." class="flex-1 px-3.5 py-2.5 bg-stone-900 border border-stone-700 rounded-xl text-sm text-stone-100 focus:outline-none focus:border-orange-500 transition" onkeydown="if(event.key==='Enter') sendStudyNote()">
            <button onclick="sendStudyNote()" class="p-2.5 bg-gradient-to-tr from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
              </svg>
            </button>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    const PEER_PREFIX = "STUDYROOM-WARM-";

    let peer = null;
    let roomCode = "";
    let myName = "";
    let myAvatarData = "🍵"; // 画像Base64 または 絵文字
    let isHost = false;
    let roomVisibility = 'public'; 
    let roomPassword = '';
    
    let isMicOn = false;
    let isScreenSharing = false;
    let localAudioStream = null;
    let screenStream = null;

    const connections = {}; 
    const participants = {}; 
    const noteHistory = []; 

    const roomSyncChannel = new BroadcastChannel('studyroom_public_sync');

    // --- アバター処理 ---

    function handleAvatarFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        alert("画像サイズは2MB以下にしてください。");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        compressImage(e.target.result, 128, 128, (resizedData) => {
          myAvatarData = resizedData;
          updateAvatarPreview();
        });
      };
      reader.readAsDataURL(file);
    }

    function selectEmojiAvatar(emoji) {
      myAvatarData = emoji;
      updateAvatarPreview();
    }

    function compressImage(base64Str, maxWidth, maxHeight, callback) {
      const img = new Image();
      img.src = base64Str;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.85));
      };
    }

    function updateAvatarPreview() {
      const initialSpan = document.getElementById('avatar-initial');
      const imgPreview = document.getElementById('avatar-image-preview');

      if (myAvatarData && myAvatarData.startsWith('data:image')) {
        imgPreview.src = myAvatarData;
        imgPreview.classList.remove('hidden');
        initialSpan.classList.add('hidden');
      } else {
        imgPreview.classList.add('hidden');
        initialSpan.classList.remove('hidden');
        initialSpan.innerText = myAvatarData || '🍵';
      }
    }

    // --- リアルタイムルーム同期 ---

    function getPublicRooms() {
      try {
        const data = localStorage.getItem('studyroom_public_rooms');
        return data ? JSON.parse(data) : {};
      } catch (e) {
        return {};
      }
    }

    function savePublicRooms(rooms) {
      try {
        localStorage.setItem('studyroom_public_rooms', JSON.stringify(rooms));
      } catch (e) {
        console.error(e);
      }
    }

    function announceRoomPublicly() {
      if (!isHost || !roomCode || roomVisibility === 'private') return;
      const rooms = getPublicRooms();
      rooms[roomCode] = {
        code: roomCode,
        hostName: myName,
        hostAvatar: myAvatarData,
        hasPassword: !!roomPassword,
        count: Object.keys(participants).length || 1,
        updatedAt: Date.now()
      };
      savePublicRooms(rooms);
      roomSyncChannel.postMessage({ type: 'room-updated', rooms: rooms });
    }

    function removeRoomPublicly() {
      if (!isHost || !roomCode) return;
      const rooms = getPublicRooms();
      delete rooms[roomCode];
      savePublicRooms(rooms);
      roomSyncChannel.postMessage({ type: 'room-updated', rooms: rooms });
    }

    function cleanExpiredRooms() {
      const rooms = getPublicRooms();
      const now = Date.now();
      let changed = false;
      Object.keys(rooms).forEach(code => {
        if (now - rooms[code].updatedAt > 300000) {
          delete rooms[code];
          changed = true;
        }
      });
      if (changed) savePublicRooms(rooms);
      return rooms;
    }

    function refreshPublicRoomsUI() {
      const rooms = cleanExpiredRooms();
      const container = document.getElementById('public-room-list');
      const roomKeys = Object.keys(rooms);

      document.getElementById('room-count-badge').innerText = `${roomKeys.length} 個の部屋`;

      if (roomKeys.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-8 text-center text-stone-400 text-sm flex flex-col items-center justify-center gap-2">
            <span>現在公開されている部屋はありません。新しい部屋を作ってみましょう！</span>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      roomKeys.forEach(code => {
        const room = rooms[code];
        const card = document.createElement('div');
        card.className = "bg-stone-900/80 border border-stone-700/80 rounded-xl p-3.5 flex items-center justify-between transition hover:border-amber-500/50";
        
        const avatarHtml = (room.hostAvatar && room.hostAvatar.startsWith('data:image'))
          ? `<img src="${room.hostAvatar}" class="w-8 h-8 rounded-full object-cover border border-amber-500/30">`
          : `<div class="w-8 h-8 rounded-full bg-orange-500 text-white font-bold text-xs flex items-center justify-center">${room.hostAvatar || '🍵'}</div>`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            ${avatarHtml}
            <div>
              <div class="flex items-center gap-2">
                <span class="font-mono font-extrabold text-orange-400 bg-stone-800 px-2 py-0.5 rounded text-xs tracking-wider border border-stone-700">${room.code}</span>
                <span class="text-xs font-bold text-stone-200 truncate max-w-[100px]">${escapeHtml(room.hostName)}</span>
                ${room.hasPassword ? '<span title="パスワード有り">🔒</span>' : ''}
              </div>
              <div class="text-[11px] text-amber-400/90 mt-0.5">${room.count} 人参加中</div>
            </div>
          </div>
          <button onclick="joinPublicRoom('${room.code}', ${room.hasPassword})" class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-lg shadow transition">
            入室
          </button>
        `;
        container.appendChild(card);
      });
    }

    roomSyncChannel.onmessage = (event) => {
      if (event.data && event.data.type === 'room-updated') {
        refreshPublicRoomsUI();
      }
    };

    function joinPublicRoom(code, hasPassword) {
      document.getElementById('input-room-code').value = code;
      openNameModal('guest', hasPassword);
    }

    setInterval(() => {
      if (isHost && roomCode) {
        announceRoomPublicly();
      }
    }, 10000);

    // --- モーダル & コントロール ---

    function setRoomVisibility(mode) {
      roomVisibility = mode;
      const btnPublic = document.getElementById('btn-vis-public');
      const btnPrivate = document.getElementById('btn-vis-private');

      if (mode === 'public') {
        btnPublic.className = "px-3 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-500/10 text-orange-400 text-xs font-bold flex items-center justify-center gap-1.5 transition";
        btnPrivate.className = "px-3 py-2.5 rounded-xl border border-stone-700 bg-stone-900 text-stone-400 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-stone-750 transition";
      } else {
        btnPrivate.className = "px-3 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-500/10 text-orange-400 text-xs font-bold flex items-center justify-center gap-1.5 transition";
        btnPublic.className = "px-3 py-2.5 rounded-xl border border-stone-700 bg-stone-900 text-stone-400 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-stone-750 transition";
      }
    }

    function openNameModal(selectedMode, hasPassword = false) {
      isHost = (selectedMode === 'host');
      document.getElementById('modal-title').innerText = isHost ? '新しい部屋を作る' : '部屋に参加する';
      document.getElementById('container-room-code').style.display = isHost ? 'none' : 'block';
      document.getElementById('container-host-options').style.display = isHost ? 'block' : 'none';
      document.getElementById('container-join-password').style.display = (!isHost && hasPassword) ? 'block' : 'none';
      
      document.getElementById('modal-name').classList.remove('hidden');
      document.getElementById('error-message').classList.add('hidden');
      updateAvatarPreview();
    }

    function closeModal() {
      document.getElementById('modal-name').classList.add('hidden');
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    async function submitNameModal() {
      const nameInput = document.getElementById('input-username').value.trim();
      const errorDiv = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');

      if (!nameInput) {
        errorText.innerText = "表示名を入力してください。";
        errorDiv.classList.remove('hidden');
        return;
      }

      myName = nameInput;

      if (isHost) {
        roomCode = generateCode();
        roomPassword = document.getElementById('input-host-password').value.trim();
        initPeer(PEER_PREFIX + roomCode);
      } else {
        const codeInput = document.getElementById('input-room-code').value.trim().toUpperCase();
        if (codeInput.length !== 5) {
          errorText.innerText = "正しい5桁のコードを入力してください。";
          errorDiv.classList.remove('hidden');
          return;
        }
        roomCode = codeInput;
        initPeer(null);
      }
    }

    function initPeer(customId) {
      closeModal();
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', () => {
        addParticipant(peer.id, myName, myAvatarData, isHost);
        startAppUI();

        if (isHost) {
          announceRoomPublicly();
        } else {
          connectToHost(PEER_PREFIX + roomCode);
        }
      });

      peer.on('error', (err) => {
        console.error(err);
        alert("通信接続エラーが発生しました。コードを確認して再試行してください。");
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      peer.on('call', (call) => {
        call.answer();
        setupIncomingMediaCall(call);
      });
    }

    function startAppUI() {
      document.getElementById('screen-title').classList.add('hidden');
      document.getElementById('screen-app').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = roomCode;
      document.getElementById('my-name-tag').innerText = myName;

      const headerAvatar = document.getElementById('header-avatar-container');
      if (myAvatarData && myAvatarData.startsWith('data:image')) {
        headerAvatar.innerHTML = `<img src="${myAvatarData}" class="w-full h-full object-cover">`;
      } else {
        headerAvatar.innerText = myAvatarData || '🍵';
      }
    }

    function connectToHost(targetPeerId) {
      const joinPass = document.getElementById('input-join-password').value.trim();
      const conn = peer.connect(targetPeerId, { metadata: { name: myName, avatar: myAvatarData, password: joinPass } });
      setupDataConnection(conn);
    }

    function setupDataConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;

        if (isHost && roomPassword) {
          const clientPass = conn.metadata ? conn.metadata.password : '';
          if (clientPass !== roomPassword) {
            conn.send({ type: 'auth-failed', message: '合言葉が一致しません。' });
            setTimeout(() => conn.close(), 500);
            return;
          }
        }

        conn.send({ type: 'join-info', name: myName, avatar: myAvatarData, peerId: peer.id, isHost: isHost });

        if (isHost) {
          conn.send({
            type: 'sync-history',
            noteHistory: noteHistory,
            participants: participants
          });
          announceRoomPublicly();
        }
      });

      conn.on('data', (data) => {
        handleIncomingData(conn.peer, data);
      });

      conn.on('close', () => {
        removeParticipant(conn.peer);
      });
    }

    function setupIncomingMediaCall(call) {
      call.on('stream', (remoteStream) => {
        const metadata = call.metadata || {};

        if (metadata.type === 'screen') {
          addScreenShareView(call.peer, metadata.name || '参加者', remoteStream);
        } else {
          let audioEl = document.getElementById(`audio-${call.peer}`);
          if (!audioEl) {
            audioEl = document.createElement('audio');
            audioEl.id = `audio-${call.peer}`;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);
          }
          audioEl.srcObject = remoteStream;
        }
      });

      call.on('close', () => {
        removeScreenShareView(call.peer);
      });
    }

    function handleIncomingData(fromPeerId, data) {
      if (data.type === 'auth-failed') {
        alert(data.message);
        location.reload();
        return;
      }

      if (data.type === 'join-info') {
        addParticipant(fromPeerId, data.name, data.avatar, data.isHost);

        if (isHost) {
          broadcastData({
            type: 'participant-joined',
            peerId: fromPeerId,
            name: data.name,
            avatar: data.avatar,
            isHost: data.isHost
          }, fromPeerId);
          announceRoomPublicly();
        }
      } else if (data.type === 'participant-joined') {
        addParticipant(data.peerId, data.name, data.avatar, data.isHost);
      } else if (data.type === 'sync-history') {
        if (data.participants) {
          Object.assign(participants, data.participants);
          renderUserGrid();
        }
        if (data.noteHistory && data.noteHistory.length > 0) {
          data.noteHistory.forEach(item => {
            const isMe = item.senderId === peer.id;
            renderStudyNote(item.name, item.avatar, item.memoText, isMe, item.file);
            noteHistory.push(item);
          });
        }
      } else if (data.type === 'study-note') {
        const isMe = data.senderId === peer.id;
        renderStudyNote(data.name, data.avatar, data.memoText, isMe, data.file);
        noteHistory.push(data);

        if (isHost) {
          broadcastData(data, fromPeerId);
        }
      } else if (data.type === 'leave') {
        removeParticipant(fromPeerId);
        if (isHost) {
          broadcastData({ type: 'leave', peerId: fromPeerId }, fromPeerId);
          announceRoomPublicly();
        }
      }
    }

    function addParticipant(peerId, name, avatar, hostFlag) {
      participants[peerId] = { name: name, avatar: avatar, isHost: hostFlag };
      renderUserGrid();
    }

    function sendStudyNote() {
      const input = document.getElementById('memo-input');
      const text = input.value.trim();
      if (!text) return;

      const noteObj = {
        type: 'study-note',
        senderId: peer.id,
        name: myName,
        avatar: myAvatarData,
        memoText: text,
        file: null
      };

      noteHistory.push(noteObj);
      renderStudyNote(myName, myAvatarData, text, true);
      broadcastData(noteObj);
      input.value = '';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 3 * 1024 * 1024) {
        alert("ファイルサイズは3MB以下にしてください。");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = { name: file.name, type: file.type, data: e.target.result };
        const noteObj = {
          type: 'study-note',
          senderId: peer.id,
          name: myName,
          avatar: myAvatarData,
          memoText: '',
          file: fileData
        };

        noteHistory.push(noteObj);
        renderStudyNote(myName, myAvatarData, '', true, fileData);
        broadcastData(noteObj);
      };
      reader.readAsDataURL(file);
    }

    function renderStudyNote(senderName, senderAvatar, memoText, isMe, file = null) {
      const memoContainer = document.getElementById('memo-list');
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-2.5 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-start`;

      const avatarHtml = (senderAvatar && senderAvatar.startsWith('data:image'))
        ? `<img src="${senderAvatar}" class="w-7 h-7 rounded-full object-cover shrink-0 border border-stone-600">`
        : `<div class="w-7 h-7 rounded-full bg-orange-500 text-white font-bold text-xs flex items-center justify-center shrink-0">${senderAvatar || '🍵'}</div>`;

      let mediaHtml = '';
      if (file) {
        if (file.type.startsWith('image/')) {
          mediaHtml = `<img src="${file.data}" class="max-w-full rounded-xl mt-1 border border-stone-700 max-h-48 object-cover">`;
        } else if (file.type.startsWith('video/')) {
          mediaHtml = `<video src="${file.data}" controls class="max-w-full rounded-xl mt-1 border border-stone-700 max-h-48"></video>`;
        } else if (file.type.startsWith('audio/')) {
          mediaHtml = `<audio src="${file.data}" controls class="w-full mt-1"></audio>`;
        }
      }

      wrapper.innerHTML = `
        ${avatarHtml}
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
          <span class="text-[10px] text-stone-400 mb-0.5 px-1 font-semibold">${escapeHtml(senderName)}</span>
          <div class="${isMe ? 'bg-gradient-to-tr from-orange-500 to-amber-500 text-white' : 'bg-stone-800 text-stone-100 border border-stone-700'} px-3.5 py-2 rounded-2xl max-w-[85%] text-xs shadow-sm break-words">
            ${memoText ? `<div>${escapeHtml(memoText)}</div>` : ''}
            ${mediaHtml}
          </div>
        </div>
      `;

      memoContainer.appendChild(wrapper);
      memoContainer.scrollTop = memoContainer.scrollHeight;
    }

    function removeParticipant(peerId) {
      delete participants[peerId];
      delete connections[peerId];
      const audioEl = document.getElementById(`audio-${peerId}`);
      if (audioEl) audioEl.remove();
      removeScreenShareView(peerId);
      renderUserGrid();
      if (isHost) announceRoomPublicly();
    }

    function renderUserGrid() {
      const grid = document.getElementById('user-grid');
      grid.innerHTML = '';

      const count = Object.keys(participants).length;
      document.getElementById('participant-count-badge').innerText = `${count} 名`;

      Object.keys(participants).forEach(id => {
        const p = participants[id];
        const isMe = id === peer?.id;

        const avatarHtml = (p.avatar && p.avatar.startsWith('data:image')) 
          ? `<img src="${p.avatar}" class="w-12 h-12 rounded-2xl object-cover shadow-md border-2 border-stone-700">`
          : `<div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white text-2xl font-bold shadow-md">${p.avatar || '🍵'}</div>`;

        const card = document.createElement('div');
        card.className = "bg-stone-800/80 border border-stone-700/80 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 relative shadow-sm";
        card.innerHTML = `
          ${avatarHtml}
          <div class="text-xs font-bold text-stone-200 truncate max-w-[100px]">${escapeHtml(p.name)} ${isMe ? '(あなた)' : ''}</div>
          ${p.isHost ? '<span class="text-[10px] bg-orange-500/20 text-orange-400 font-bold border border-orange-500/30 px-2 py-0.5 rounded-full">HOST</span>' : ''}
        `;
        grid.appendChild(card);
      });
    }

    function addScreenShareView(peerId, userName, stream) {
      const grid = document.getElementById('screenshare-grid');
      grid.classList.remove('hidden');

      let container = document.getElementById(`screen-container-${peerId}`);
      if (!container) {
        container = document.createElement('div');
        container.id = `screen-container-${peerId}`;
        container.className = "relative bg-stone-950 rounded-2xl overflow-hidden border border-stone-700 shadow-xl w-full min-h-[300px] max-h-[500px] flex items-center justify-center";

        container.innerHTML = `
          <video id="video-${peerId}" autoplay playsinline class="w-full h-full object-contain"></video>
          <div class="absolute top-3 left-3 bg-stone-900/90 px-3 py-1.5 rounded-full text-xs text-amber-400 border border-amber-500/30 flex items-center gap-2 shadow-md">
            <span>📺 ${escapeHtml(userName)} の画面</span>
          </div>
        `;
        grid.appendChild(container);
      }

      const video = document.getElementById(`video-${peerId}`);
      video.srcObject = stream;
    }

    function removeScreenShareView(peerId) {
      const container = document.getElementById(`screen-container-${peerId}`);
      if (container) container.remove();

      const grid = document.getElementById('screenshare-grid');
      if (grid.children.length === 0) {
        grid.classList.add('hidden');
      }
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const msgObj = {
        type: 'chat',
        senderId: peer.id,
        name: myName,
        avatar: myAvatarData,
        message: text,
        file: null
      };

      chatHistory.push(msgObj);
      renderChatMessage(myName, myAvatarData, text, true);
      broadcastData(msgObj);
      input.value = '';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 3 * 1024 * 1024) {
        alert("ファイルサイズは3MB以下にしてください。");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = { name: file.name, type: file.type, data: e.target.result };
        const msgObj = {
          type: 'chat',
          senderId: peer.id,
          name: myName,
          avatar: myAvatarData,
          message: '',
          file: fileData
        };

        chatHistory.push(msgObj);
        renderChatMessage(myName, myAvatarData, '', true, fileData);
        broadcastData(msgObj);
      };
      reader.readAsDataURL(file);
    }

    function broadcastData(data, excludePeerId = null) {
      Object.keys(connections).forEach(peerId => {
        if (peerId !== excludePeerId && connections[peerId] && connections[peerId].open) {
          connections[peerId].send(data);
        }
      });
    }

    function renderChatMessage(senderName, senderAvatar, message, isMe, file = null) {
      const chatContainer = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-2.5 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-start`;

      const avatarHtml = (senderAvatar && senderAvatar.startsWith('data:image'))
        ? `<img src="${senderAvatar}" class="w-7 h-7 rounded-full object-cover shrink-0 border border-stone-600">`
        : `<div class="w-7 h-7 rounded-full bg-orange-500 text-white font-bold text-xs flex items-center justify-center shrink-0">${senderAvatar || '🍵'}</div>`;

      let mediaHtml = '';
      if (file) {
        if (file.type.startsWith('image/')) {
          mediaHtml = `<img src="${file.data}" class="max-w-full rounded-xl mt-1 border border-stone-700 max-h-48 object-cover">`;
        } else if (file.type.startsWith('video/')) {
          mediaHtml = `<video src="${file.data}" controls class="max-w-full rounded-xl mt-1 border border-stone-700 max-h-48"></video>`;
        } else if (file.type.startsWith('audio/')) {
          mediaHtml = `<audio src="${file.data}" controls class="w-full mt-1"></audio>`;
        }
      }

      wrapper.innerHTML = `
        ${avatarHtml}
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
          <span class="text-[10px] text-stone-400 mb-0.5 px-1 font-semibold">${escapeHtml(senderName)}</span>
          <div class="${isMe ? 'bg-gradient-to-tr from-orange-500 to-amber-500 text-white' : 'bg-stone-800 text-stone-100 border border-stone-700'} px-3.5 py-2 rounded-2xl max-w-[85%] text-xs shadow-sm break-words">
            ${message ? `<div>${escapeHtml(message)}</div>` : ''}
            ${mediaHtml}
          </div>
        </div>
      `;

      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    async function toggleMic() {
      const btn = document.getElementById('btn-mic');
      if (!isMicOn) {
        try {
          localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true;
          btn.className = "px-3 py-2 bg-emerald-600 text-white font-semibold text-xs rounded-xl transition flex items-center gap-1.5 shadow-sm";
          btn.innerHTML = `🎙️ <span class="hidden sm:inline">マイク ON</span>`;

          Object.keys(connections).forEach(peerId => {
            peer.call(peerId, localAudioStream, { metadata: { type: 'audio', name: myName } });
          });
        } catch (err) {
          alert("マイクの利用許可が得られませんでした。");
        }
      } else {
        if (localAudioStream) {
          localAudioStream.getTracks().forEach(track => track.stop());
        }
        isMicOn = false;
        btn.className = "px-3 py-2 bg-stone-700 hover:bg-stone-650 text-stone-200 font-semibold text-xs rounded-xl transition border border-stone-600 flex items-center gap-1.5 shadow-sm";
        btn.innerHTML = `<svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg><span class="hidden sm:inline">マイク OFF</span>`;
      }
    }

    async function toggleScreenShare() {
      const btn = document.getElementById('btn-screen');

      if (!isScreenSharing) {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ 
            video: { displaySurface: 'window' }, 
            selfBrowserSurface: 'exclude'
          });
          isScreenSharing = true;
          btn.className = "px-3 py-2 bg-orange-500 text-white font-semibold text-xs rounded-xl transition flex items-center gap-1.5 shadow-sm";

          addScreenShareView(peer.id, myName + " (あなた)", screenStream);

          Object.keys(connections).forEach(peerId => {
            peer.call(peerId, screenStream, { metadata: { type: 'screen', name: myName } });
          });

          screenStream.getVideoTracks()[0].onended = () => {
            stopScreenShare();
          };
        } catch (err) {
          console.log("画面共有キャンセル");
        }
      } else {
        stopScreenShare();
      }
    }

    function stopScreenShare() {
      const btn = document.getElementById('btn-screen');
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
      }
      removeScreenShareView(peer.id);
      isScreenSharing = false;
      btn.className = "px-3 py-2 bg-stone-700 hover:bg-stone-650 text-stone-200 font-semibold text-xs rounded-xl transition border border-stone-600 flex items-center gap-1.5 shadow-sm";
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(roomCode);
      alert(`部屋コード "${roomCode}" をコピーしました！`);
    }

    function leaveRoom() {
      if (isHost) {
        removeRoomPublicly();
      }
      broadcastData({ type: 'leave' });
      if (peer) peer.destroy();
      location.reload();
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshPublicRoomsUI();
    });

    window.addEventListener('beforeunload', () => {
      if (isHost) {
        removeRoomPublicly();
      }
      broadcastData({ type: 'leave' });
    });
  </script>
</body>
</html>
