    <!-- メインコンテンツエリア -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
      
      <!-- メインワークスペース（画面共有 ＋ 参加者一覧） -->
      <div class="flex-1 p-4 flex flex-col gap-5 overflow-y-auto">

        <!-- チャットヘッダー -->
        <div class="px-4 py-3 border-b border-amber-100 bg-amber-50/50 flex items-center justify-between text-xs font-bold text-stone-600 uppercase tracking-wider">
          <span class="flex items-center gap-2">
            <i class="fa-solid fa-comments text-orange-500"></i> ルームチャット
          </span>
          <span class="text-[10px] text-stone-400 font-normal">リアルタイム送信</span>
        </div>

        <!-- メッセージ表示エリア -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-stone-50/30"></div>

        <!-- チャット入力フォーム -->
        <div class="p-3 bg-white border-t border-amber-200/80 shrink-0">
          <div class="flex items-center gap-2">
            <label title="画像を添付" class="p-2.5 bg-amber-100/70 hover:bg-amber-200 text-amber-800 rounded-xl cursor-pointer transition flex items-center justify-center">
              <i class="fa-solid fa-paperclip"></i>
              <input type="file" id="file-input" class="hidden" accept="image/*,video/*,audio/*" onchange="handleFileUpload(event)">
            </label>
            <input type="text" id="chat-input" placeholder="メッセージを入力..." class="flex-1 px-3.5 py-2.5 bg-amber-50/40 border border-amber-200 rounded-xl text-sm text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-500/40 focus:border-orange-500 transition" onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="p-2.5 bg-gradient-to-tr from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl shadow-md shadow-orange-500/20 transition flex items-center justify-center">

  <script>
    // 定数設定
    const NG_WORDS = ["しね", "バカ", "アホ", "死ね", "殺す", "キモい", "fuck", "shit", "bitch"];
    const PEER_PREFIX = "STUDYROOM-WARM-";

    // アプリケーション状態
    let peer = null;
    let roomCode = "";
    let myName = "";
    let myAvatarData = null; // ローカル画像 Base64
    let isHost = false;
    let roomVisibility = 'public'; // 'public' | 'private'
    let roomPassword = '';
    
    let isMicOn = false;
    let isScreenSharing = false;
    let localAudioStream = null;
    let screenStream = null;

    const connections = {}; 
    const participants = {}; 
    const chatHistory = []; 

    // ブロードキャストチャネル（リアルタイムルーム同期用）
    const roomSyncChannel = new BroadcastChannel('studyroom_public_sync');

    // ==================== アバター画像処理 ====================

    function handleAvatarFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        alert("アバター画像は2MB以下にしてください。");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        // 画像を自動リサイズして容量を削減
        compressImage(e.target.result, 128, 128, (resizedData) => {
          myAvatarData = resizedData;
          updateAvatarPreview();
        });
      };
      reader.readAsDataURL(file);
    }

    function compressImage(base64Str, maxWidth, maxHeight, callback) {
      const img = new Image();
      img.src = base64Str;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.85));
      };
    }

    function updateAvatarPreview() {
      const nameInput = document.getElementById('input-username').value.trim();
      const initialSpan = document.getElementById('avatar-initial');
      const imgPreview = document.getElementById('avatar-image-preview');

      if (myAvatarData) {
        imgPreview.src = myAvatarData;
        imgPreview.classList.remove('hidden');
        initialSpan.classList.add('hidden');
      } else {
        imgPreview.classList.add('hidden');
        initialSpan.classList.remove('hidden');
        initialSpan.innerText = nameInput ? nameInput.charAt(0).toUpperCase() : '?';
      }
    }

    // ==================== ルーム公開・リアルタイム同期機能 ====================

    function getPublicRooms() {
      try {
        const data = localStorage.getItem('studyroom_public_rooms');
        return data ? JSON.parse(data) : {};
      } catch (e) {
        return {};
      }
    }

    function savePublicRooms(rooms) {
      try {
        localStorage.setItem('studyroom_public_rooms', JSON.stringify(rooms));
      } catch (e) {
        console.error("Storage error:", e);
      }
    }

    function announceRoomPublicly() {
      if (!isHost || !roomCode || roomVisibility === 'private') return;
      const rooms = getPublicRooms();
      rooms[roomCode] = {
        code: roomCode,
        hostName: myName,
        hostAvatar: myAvatarData,
        hasPassword: !!roomPassword,
        count: Object.keys(participants).length || 1,
        updatedAt: Date.now()
      };
      savePublicRooms(rooms);
      roomSyncChannel.postMessage({ type: 'room-updated', rooms: rooms });
    }

    function removeRoomPublicly() {
      if (!isHost || !roomCode) return;
      const rooms = getPublicRooms();
      delete rooms[roomCode];
      savePublicRooms(rooms);
      roomSyncChannel.postMessage({ type: 'room-updated', rooms: rooms });
    }

    function cleanExpiredRooms() {
      const rooms = getPublicRooms();
      const now = Date.now();
      let changed = false;
      Object.keys(rooms).forEach(code => {
        if (now - rooms[code].updatedAt > 300000) {
          delete rooms[code];
          changed = true;
        }
      });
      if (changed) savePublicRooms(rooms);
      return rooms;
    }

    function refreshPublicRoomsUI() {
      const rooms = cleanExpiredRooms();
      const container = document.getElementById('public-room-list');
      const roomKeys = Object.keys(rooms);

      document.getElementById('room-count-badge').innerText = `${roomKeys.length} 個の部屋`;

      if (roomKeys.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-8 text-center text-stone-400 text-sm flex flex-col items-center justify-center gap-2">
            <i class="fa-solid fa-mug-saucer text-2xl text-amber-300"></i>
            <span>現在公開されている部屋はありません。部屋を作成してみましょう！</span>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      roomKeys.forEach(code => {
        const room = rooms[code];
        const card = document.createElement('div');
        card.className = "bg-amber-50/50 hover:bg-amber-100/60 border border-amber-200/80 rounded-xl p-3.5 flex items-center justify-between transition group";
        
        const avatarHtml = room.hostAvatar 
          ? `<img src="${room.hostAvatar}" class="w-8 h-8 rounded-full object-cover border border-amber-200">`
          : `<div class="w-8 h-8 rounded-full bg-orange-500 text-white font-bold text-xs flex items-center justify-center">${escapeHtml(room.hostName).charAt(0).toUpperCase()}</div>`;

        card.innerHTML = `
          <div class="flex items-center gap-3 space-y-0">
            ${avatarHtml}
            <div class="space-y-0.5">
              <div class="flex items-center gap-2">
                <span class="font-mono font-extrabold text-orange-600 bg-amber-100 px-2 py-0.5 rounded text-xs tracking-wider">${room.code}</span>
                <span class="text-xs font-bold text-stone-700 truncate max-w-[100px]">${escapeHtml(room.hostName)}</span>
                ${room.hasPassword ? '<i class="fa-solid fa-lock text-xs text-amber-600" title="パスワード保護"></i>' : ''}
              </div>
              <div class="text-[11px] text-stone-500 flex items-center gap-2">
                <span class="flex items-center gap-1 text-amber-700 font-semibold">
                  <i class="fa-solid fa-user text-[10px]"></i> ${room.count} 人参加中
                </span>
              </div>
            </div>
          </div>
          <button onclick="joinPublicRoom('${room.code}', ${room.hasPassword})" class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-lg shadow-sm transition">
            参加
          </button>
        `;
        container.appendChild(card);
      });
    }

    roomSyncChannel.onmessage = (event) => {
      if (event.data && event.data.type === 'room-updated') {
        refreshPublicRoomsUI();
      }
    };

    function joinPublicRoom(code, hasPassword) {
      document.getElementById('input-room-code').value = code;
      openNameModal('guest', hasPassword);
    }

    setInterval(() => {
      if (isHost && roomCode) {
        announceRoomPublicly();
      }
    }, 10000);

    // ==================== モーダル ＆ UI操作 ====================

    function setRoomVisibility(mode) {
      roomVisibility = mode;
      const btnPublic = document.getElementById('btn-vis-public');
      const btnPrivate = document.getElementById('btn-vis-private');

      if (mode === 'public') {
        btnPublic.className = "px-3 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 text-xs font-bold flex items-center justify-center gap-1.5 transition";
        btnPrivate.className = "px-3 py-2.5 rounded-xl border border-stone-200 bg-white text-stone-600 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-amber-50 transition";
      } else {
        btnPrivate.className = "px-3 py-2.5 rounded-xl border-2 border-orange-500 bg-orange-50 text-orange-700 text-xs font-bold flex items-center justify-center gap-1.5 transition";
        btnPublic.className = "px-3 py-2.5 rounded-xl border border-stone-200 bg-white text-stone-600 text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-amber-50 transition";
      }
    }

    function openNameModal(selectedMode, hasPassword = false) {
      isHost = (selectedMode === 'host');
      document.getElementById('modal-title').innerText = isHost ? '新しい部屋を作る' : '部屋に参加する';
      document.getElementById('container-room-code').style.display = isHost ? 'none' : 'block';
      document.getElementById('container-host-options').style.display = isHost ? 'block' : 'none';
      document.getElementById('container-join-password').style.display = (!isHost && hasPassword) ? 'block' : 'none';
      
      document.getElementById('modal-name').classList.remove('hidden');
      document.getElementById('error-message').classList.add('hidden');
      updateAvatarPreview();
    }

    function closeModal() {
      document.getElementById('modal-name').classList.add('hidden');
    }

    function containsNGWords(text) {
      if (!text) return false;
      const lower = text.toLowerCase();
      return NG_WORDS.some(ng => lower.includes(ng));
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    async function submitNameModal() {
      const nameInput = document.getElementById('input-username').value.trim();
      const errorDiv = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');

      if (!nameInput) {
        errorText.innerText = "表示名を入力してください。";
        errorDiv.classList.remove('hidden');
        return;
      }

      if (containsNGWords(nameInput)) {
        errorText.innerText = "不適切な表現が含まれています。";
        errorDiv.classList.remove('hidden');
        return;
      }

      myName = nameInput;

      if (isHost) {
        roomCode = generateCode();
        roomPassword = document.getElementById('input-host-password').value.trim();
        initPeer(PEER_PREFIX + roomCode);
      } else {
        const codeInput = document.getElementById('input-room-code').value.trim().toUpperCase();
        if (codeInput.length !== 5) {
          errorText.innerText = "正しい5桁のコードを入力してください。";
          errorDiv.classList.remove('hidden');
          return;
        }
        roomCode = codeInput;
        initPeer(null);
      }
    }

    function initPeer(customId) {
      closeModal();
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        addParticipant(peer.id, myName, myAvatarData, isHost);
        startAppUI();

        if (isHost) {
          announceRoomPublicly();
        } else {
          connectToHost(PEER_PREFIX + roomCode);
        }
      });

      peer.on('error', (err) => {
        console.error(err);
        if (err.type === 'unavailable-id') {
          alert("その部屋コードは既に使われているか接続できません。");
        } else {
          alert("接続エラーが発生しました: " + err.type);
        }
      });

      peer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      peer.on('call', (call) => {
        call.answer();
        setupIncomingMediaCall(call);
      });
    }

    function startAppUI() {
      document.getElementById('screen-title').classList.add('hidden');
      document.getElementById('screen-app').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = roomCode;
      document.getElementById('my-name-tag').innerText = myName;

      // ヘッダーアバター更新
      const headerAvatar = document.getElementById('header-avatar-container');
      if (myAvatarData) {
        headerAvatar.innerHTML = `<img src="${myAvatarData}" class="w-full h-full object-cover">`;
      } else {
        headerAvatar.innerText = myName.charAt(0).toUpperCase();
      }
    }

    function connectToHost(targetPeerId) {
      const joinPass = document.getElementById('input-join-password').value.trim();
      const conn = peer.connect(targetPeerId, { metadata: { name: myName, avatar: myAvatarData, password: joinPass } });
      setupDataConnection(conn);
    }

    function setupDataConnection(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;

        // ホスト側でパスワード検証
        if (isHost && roomPassword) {
          const clientPass = conn.metadata ? conn.metadata.password : '';
          if (clientPass !== roomPassword) {
            conn.send({ type: 'auth-failed', message: 'パスワードが正しくありません。' });
            setTimeout(() => conn.close(), 500);
            return;
          }
        }

        conn.send({ type: 'join-info', name: myName, avatar: myAvatarData, peerId: peer.id, isHost: isHost });

        if (isHost) {
          conn.send({
            type: 'sync-history',
            chatHistory: chatHistory,
            participants: participants
          });
          announceRoomPublicly();
        }
      });

      conn.on('data', (data) => {
        handleIncomingData(conn.peer, data);
      });

      conn.on('close', () => {
        removeParticipant(conn.peer);
      });
    }

    function setupIncomingMediaCall(call) {
      call.on('stream', (remoteStream) => {
        const metadata = call.metadata || {};

        if (metadata.type === 'screen') {
          addScreenShareView(call.peer, metadata.name || '参加者', remoteStream);
        } else {
          let audioEl = document.getElementById(`audio-${call.peer}`);
          if (!audioEl) {
            audioEl = document.createElement('audio');
            audioEl.id = `audio-${call.peer}`;
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);
          }
          audioEl.srcObject = remoteStream;
        }
      });

      call.on('close', () => {
        removeScreenShareView(call.peer);
      });
    }

    function handleIncomingData(fromPeerId, data) {
      if (data.type === 'auth-failed') {
        alert(data.message);
        location.reload();
        return;
      }

      if (data.type === 'join-info') {
        addParticipant(fromPeerId, data.name, data.avatar, data.isHost);

        if (isHost) {
          broadcastData({
            type: 'participant-joined',
            peerId: fromPeerId,
            name: data.name,
            avatar: data.avatar,
            isHost: data.isHost
          }, fromPeerId);
          announceRoomPublicly();
        }
      } else if (data.type === 'participant-joined') {
        addParticipant(data.peerId, data.name, data.avatar, data.isHost);
      } else if (data.type === 'sync-history') {
        if (data.participants) {
          Object.assign(participants, data.participants);
          renderUserGrid();
        }
        if (data.chatHistory && data.chatHistory.length > 0) {
          data.chatHistory.forEach(item => {
            const isMe = item.senderId === peer.id;
            renderChatMessage(item.name, item.avatar, item.message, isMe, item.file);
            chatHistory.push(item);
          });
        }
      } else if (data.type === 'chat') {
        const isMe = data.senderId === peer.id;
        renderChatMessage(data.name, data.avatar, data.message, isMe, data.file);
        chatHistory.push(data);

        if (isHost) {
          broadcastData(data, fromPeerId);
        }
      } else if (data.type === 'leave') {
        removeParticipant(fromPeerId);
        if (isHost) {
          broadcastData({ type: 'leave', peerId: fromPeerId }, fromPeerId);
          announceRoomPublicly();
        }
      }
    }

    function addParticipant(peerId, name, avatar, hostFlag) {
      participants[peerId] = { name: name, avatar: avatar, isHost: hostFlag };
      renderUserGrid();
    }

    function removeParticipant(peerId) {
      delete participants[peerId];
      delete connections[peerId];
      const audioEl = document.getElementById(`audio-${peerId}`);
      if (audioEl) audioEl.remove();
      removeScreenShareView(peerId);
      renderUserGrid();
      if (isHost) announceRoomPublicly();
    }

    function renderUserGrid() {
      const grid = document.getElementById('user-grid');
      grid.innerHTML = '';

      const count = Object.keys(participants).length;
      document.getElementById('participant-count-badge').innerText = `${count} 名`;

      Object.keys(participants).forEach(id => {
        const p = participants[id];
        const isMe = id === peer?.id;

        const avatarHtml = p.avatar 
          ? `<img src="${p.avatar}" class="w-12 h-12 rounded-2xl object-cover shadow-md border-2 border-white">`
          : `<div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white font-extrabold text-lg shadow-md shadow-orange-500/20">${escapeHtml(p.name).charAt(0).toUpperCase()}</div>`;

        const card = document.createElement('div');
        card.className = "bg-white border border-amber-200/80 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 relative shadow-sm";
        card.innerHTML = `
          ${avatarHtml}
          <div class="text-xs font-bold text-stone-700 truncate max-w-[100px]">${escapeHtml(p.name)} ${isMe ? '(あなた)' : ''}</div>
          ${p.isHost ? '<span class="text-[10px] bg-orange-100 text-orange-700 font-bold border border-orange-200 px-2 py-0.5 rounded-full">HOST</span>' : ''}
        `;
        grid.appendChild(card);
      });
    }

    // 画面共有ビュー
    function addScreenShareView(peerId, userName, stream) {
      const grid = document.getElementById('screenshare-grid');
      grid.classList.remove('hidden');

      let container = document.getElementById(`screen-container-${peerId}`);
      if (!container) {
        container = document.createElement('div');
        container.id = `screen-container-${peerId}`;
        container.className = "relative bg-stone-900 rounded-2xl overflow-hidden border border-amber-200 shadow-xl w-full min-h-[300px] max-h-[500px] flex items-center justify-center";

        container.innerHTML = `
          <video id="video-${peerId}" autoplay playsinline class="w-full h-full object-contain"></video>
          <div class="absolute top-3 left-3 bg-stone-900/80 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-amber-400 border border-amber-500/30 flex items-center gap-2 shadow-md">
            <i class="fa-solid fa-desktop"></i>
            <span>${escapeHtml(userName)} の画面</span>
          </div>
        `;
        grid.appendChild(container);
      }

      const video = document.getElementById(`video-${peerId}`);
      video.srcObject = stream;
    }

    function removeScreenShareView(peerId) {
      const container = document.getElementById(`screen-container-${peerId}`);
      if (container) container.remove();

      const grid = document.getElementById('screenshare-grid');
      if (grid.children.length === 0) {
        grid.classList.add('hidden');
      }
    }

    // チャットメッセージ送信
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (containsNGWords(text)) {
        alert("不適切な表現が含まれています。");
        return;
      }

      const msgObj = {
        type: 'chat',
        senderId: peer.id,
        name: myName,
        avatar: myAvatarData,
        message: text,
        file: null
      };

      chatHistory.push(msgObj);
      renderChatMessage(myName, myAvatarData, text, true);
      broadcastData(msgObj);
      input.value = '';
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 3 * 1024 * 1024) {
        alert("ファイルサイズは3MB以下にしてください。");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const fileData = { name: file.name, type: file.type, data: e.target.result };
        const msgObj = {
          type: 'chat',
          senderId: peer.id,
          name: myName,
          avatar: myAvatarData,
          message: '',
          file: fileData
        };

        chatHistory.push(msgObj);
        renderChatMessage(myName, myAvatarData, '', true, fileData);
        broadcastData(msgObj);
      };
      reader.readAsDataURL(file);
    }

    function broadcastData(data, excludePeerId = null) {
      Object.keys(connections).forEach(peerId => {
        if (peerId !== excludePeerId && connections[peerId] && connections[peerId].open) {
          connections[peerId].send(data);
        }
      });
    }

    function renderChatMessage(senderName, senderAvatar, message, isMe, file = null) {
      const chatContainer = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-2.5 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-start`;

      const avatarHtml = senderAvatar 
        ? `<img src="${senderAvatar}" class="w-7 h-7 rounded-full object-cover shrink-0 border border-amber-200">`
        : `<div class="w-7 h-7 rounded-full bg-orange-500 text-white font-bold text-[10px] flex items-center justify-center shrink-0">${escapeHtml(senderName).charAt(0).toUpperCase()}</div>`;

      let mediaHtml = '';
      if (file) {
        if (file.type.startsWith('image/')) {
          mediaHtml = `<img src="${file.data}" class="max-w-full rounded-xl mt-1 border border-amber-200 max-h-48 object-cover">`;
        } else if (file.type.startsWith('video/')) {
          mediaHtml = `<video src="${file.data}" controls class="max-w-full rounded-xl mt-1 border border-amber-200 max-h-48"></video>`;
        } else if (file.type.startsWith('audio/')) {
          mediaHtml = `<audio src="${file.data}" controls class="w-full mt-1"></audio>`;
        }
      }

      wrapper.innerHTML = `
        ${avatarHtml}
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
          <span class="text-[10px] text-stone-400 mb-0.5 px-1 font-semibold">${escapeHtml(senderName)}</span>
          <div class="${isMe ? 'bg-gradient-to-tr from-orange-500 to-amber-500 text-white' : 'bg-white text-stone-800 border border-amber-200/80'} px-3.5 py-2 rounded-2xl max-w-[85%] text-xs shadow-sm break-words">
            ${message ? `<div>${escapeHtml(message)}</div>` : ''}
            ${mediaHtml}
          </div>
        </div>
      `;

      chatContainer.appendChild(wrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // マイクの切替
    async function toggleMic() {
      const btn = document.getElementById('btn-mic');
      if (!isMicOn) {
        try {
          localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true;
          btn.className = "px-3.5 py-2 bg-emerald-500 text-white font-semibold text-xs rounded-xl transition flex items-center gap-2 shadow-sm shadow-emerald-500/20";
          btn.innerHTML = `<i class="fa-solid fa-microphone"></i><span class="hidden sm:inline">マイク ON</span>`;

          Object.keys(connections).forEach(peerId => {
            peer.call(peerId, localAudioStream, { metadata: { type: 'audio', name: myName } });
          });
        } catch (err) {
          alert("マイクの利用許可が得られませんでした。");
        }
      } else {
        if (localAudioStream) {
          localAudioStream.getTracks().forEach(track => track.stop());
        }
        isMicOn = false;
        btn.className = "px-3.5 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-xs rounded-xl transition border border-stone-200 flex items-center gap-2 shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-microphone-slash text-rose-500"></i><span class="hidden sm:inline">マイク OFF</span>`;
      }
    }

    // 画面共有の切替
    async function toggleScreenShare() {
      const btn = document.getElementById('btn-screen');

      if (!isScreenSharing) {
        try {
          // ブラウザ通知バーを小さくするためのキャプチャ設定オプション
          screenStream = await navigator.mediaDevices.getDisplayMedia({ 
            video: { displaySurface: 'window' }, 
            selfBrowserSurface: 'exclude'
          });
          isScreenSharing = true;
          btn.className = "px-3.5 py-2 bg-orange-500 text-white font-semibold text-xs rounded-xl transition flex items-center gap-2 shadow-sm shadow-orange-500/20";

          addScreenShareView(peer.id, myName + " (あなた)", screenStream);

          Object.keys(connections).forEach(peerId => {
            peer.call(peerId, screenStream, { metadata: { type: 'screen', name: myName } });
          });

          screenStream.getVideoTracks()[0].onended = () => {
            stopScreenShare();
          };
        } catch (err) {
          console.log("画面共有がキャンセルされました");
        }
      } else {
        stopScreenShare();
      }
    }

    function stopScreenShare() {
      const btn = document.getElementById('btn-screen');
      if (screenStream) {
        screenStream.getTracks().forEach(track => track.stop());
      }
      removeScreenShareView(peer.id);
      isScreenSharing = false;
      btn.className = "px-3.5 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold text-xs rounded-xl transition border border-stone-200 flex items-center gap-2 shadow-sm";
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(roomCode);
      alert(`部屋コード "${roomCode}" をコピーしました！`);
    }

    function leaveRoom() {
      if (isHost) {
        removeRoomPublicly();
      }
      broadcastData({ type: 'leave' });
      if (peer) peer.destroy();
      location.reload();
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshPublicRoomsUI();
    });

    window.addEventListener('beforeunload', () => {
      if (isHost) {
        removeRoomPublicly();
      }
      broadcastData({ type: 'leave' });
    });
  </script>
</body>
</html>
